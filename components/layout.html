<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics — নিজের GA4 measurement ID দিয়ে বদলে দিন -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    <link rel="icon" type="image/webp" href="/assets/photos/mobilekhujo-logo.webp">
    <link rel="apple-touch-icon" href="/assets/photos/mobilekhujo-logo.webp">
    <title>{{full_title}}</title>
    <meta name="description" content="{{page_description}}">
    <meta name="robots" content="{{robots_meta}}">
    <link rel="canonical" href="{{page_url}}">
    <meta property="og:title" content="{{full_title}}">
    <meta property="og:description" content="{{page_description}}">
    <meta property="og:image" content="{{page_image}}">
    <meta property="og:url" content="{{page_url}}">
    <meta property="og:type" content="{{page_type}}">
    <meta property="og:site_name" content="Mobile Khujo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{full_title}}">
    <meta name="twitter:description" content="{{page_description}}">
    <meta name="twitter:image" content="{{page_image}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#f0f8ff',
                            100: '#dbeeff',
                            500: '#1e90ff',
                            600: '#1a7ad9'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {
            content: '·';
            color: #9ca3af;
            font-size: 16px;
            margin: 0 5px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list li.line-start::before { display: none !important; }
        .category-underline-list a {
            font-size: 17px;
            font-weight: 400;
            color: #1e90ff;
            text-decoration: none;
            transition: color 0.15s;
        }
        .category-underline-list a:hover { color: #1a7ad9; text-decoration: underline; }
        .category-underline-list a:active,
        .category-underline-list a:focus { text-decoration: underline; outline: none; }
        .dark .category-underline-list a { color: #63b3ff; }
        .dark .category-underline-list a:hover,
        .dark .category-underline-list a:active { color: #8ec8ff; text-decoration: underline; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #1e90ff;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #1a7ad9; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #63b3ff; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #8ec8ff; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
        /* Visit counter — retro LCD display */
        .mk-visit-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #0e1a2b;
            border-radius: 0;
            padding: 0.15rem 0.7rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            font-family: 'Courier New', Consolas, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #3ba8ff;
            text-shadow: 0 0 8px rgba(59,168,255,0.75);
            white-space: nowrap;
        }
        .mk-visit-pill i { font-size: 0.7rem; color: #3ba8ff; opacity: 0.85; }
        .mk-visit-pill .mk-sep { color: #3ba8ff; margin: 0 0.05rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-white dark:bg-[#1a1a1b] border-b border-gray-200 dark:border-gray-700 sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <button id="menu-toggle" aria-label="Menu" class="text-gray-700 dark:text-gray-200 text-xl w-9 h-9 flex items-center justify-center">
                <i class="fas fa-bars"></i>
            </button>

            <{{hero_tag}} class="m-0 leading-none">
                <a href="/" class="flex items-center">
                    <span class="text-2xl" style="font-family:'Fredoka', sans-serif; font-weight:700;">
                        <span style="color:#1e90ff;">Mobile</span><span class="text-gray-700 dark:text-gray-200">Khujo</span>
                    </span>
                </a>
            </{{hero_tag}}>

            <div class="flex items-center gap-4">
                <a href="/search.html" aria-label="Search" class="text-gray-700 dark:text-gray-200 text-lg w-9 h-9 flex items-center justify-center">
                    <i class="fas fa-search"></i>
                </a>
            </div>
        </div>
    </header>

    <script>
    (function() {
        // ডার্ক মোড টগল বাটন এখন sidebar-এ যাবে (পরে যুক্ত হবে) —
        // এখানে শুধু আগে থেকে সেভ করা preference apply করা হচ্ছে
        var root = document.documentElement;
        var stored = localStorage.getItem('mk-theme');
        if (stored === 'dark') root.classList.add('dark');
    })();
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>


    <!-- FOOTER -->
    <footer class="bg-gray-100 dark:bg-[#1f1f1f] border-t border-gray-300 dark:border-gray-700 mt-8">

        <!-- Brand row: always visible on mobile, hidden on desktop (icons move to bottom row) -->
        <div class="max-w-3xl mx-auto px-5 pt-6 pb-4 flex items-center justify-between">
            <div>
                <a href="/" class="flex items-center">
                    <span class="text-3xl" style="font-family:'Fredoka', sans-serif; font-weight:700;">
                        <span style="color:#1e90ff;">Mobile</span><span class="text-gray-700 dark:text-gray-200">Khujo</span>
                    </span>
                </a>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 tracking-wide uppercase">Latest Mobile Specifications in BD</p>
            </div>
            <!-- Social icons -->
            <div class="flex items-center gap-2">
                <a href="https://facebook.com/mobilekhujo" target="_blank" rel="noopener" aria-label="Facebook"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#1877f2] hover:border-[#1877f2] transition-all">
                    <i class="fab fa-facebook-f text-lg"></i>
                </a>
                <a href="https://t.me/mobilekhujo" target="_blank" rel="noopener" aria-label="Telegram"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#229ed9] hover:border-[#229ed9] transition-all">
                    <i class="fab fa-telegram-plane text-lg"></i>
                </a>
            </div>
        </div>

        <!-- Divider -->
        <div class="max-w-3xl mx-auto px-5">
            <div class="border-t border-gray-300 dark:border-gray-700"></div>
        </div>

        <!-- Dot-separated links — mobile: wrap, desktop: single row -->
        <div class="max-w-3xl mx-auto px-5 py-3 flex flex-wrap md:flex-nowrap items-center justify-between gap-y-2">
            <!-- Links -->
            <div class="flex flex-wrap md:flex-nowrap items-center gap-y-1">
                <a href="/about" class="footer-dot-link">About</a>
                <span class="footer-dot">·</span>
                <a href="/contact" class="footer-dot-link">Contact</a>
                <span class="footer-dot">·</span>
                <a href="/policy" class="footer-dot-link">Terms</a>
            </div>

            <!-- Visit counter -->
            <span id="mk-visit-counter" class="mk-visit-pill"><i class="fa-solid fa-arrow-trend-up"></i> <b>**</b> <span class="mk-sep">|</span> <b>**</b></span>

        </div>

    </footer>

    <script>
        // Visit counter — increments on each page load/refresh
        (function () {
            const el = document.getElementById('mk-visit-counter');
            if (!el) return;
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = data.today;
                    nums[1].textContent = data.total;
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>


</body>
</html>
